version: 2

project_name: codex-sess

builds:
  - id: codex-sess
    main: .
    binary: codex-sess
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1
    flags:
      - -trimpath
      - -buildvcs=false
      - -mod=readonly
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: binaries
    ids:
      - codex-sess
    formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - README.zh-CN.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc

release:
  name_template: '{{ .Tag }}'
  prerelease: auto
